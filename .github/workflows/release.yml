name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Als Pre-Release markieren"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus manifest.json lesen
        id: version
        run: |
          version=$(jq -r .version custom_components/dji_flightlog/manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Keine Version in manifest.json gefunden"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob das Release schon existiert
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG existiert bereits - Version in manifest.json erhöhen"
            exit 1
          fi

      - name: Zip bauen
        run: |
          cd custom_components
          zip -r ../dji_flightlog.zip dji_flightlog -x '*/__pycache__/*' '*.pyc'

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dji_flightlog.zip "${args[@]}"
