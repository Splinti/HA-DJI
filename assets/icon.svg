<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3F3"/>
      <stop offset="1" stop-color="#1A3F9E"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0A1F4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Kachel -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Höhenlinien der Karte -->
  <g clip-path="url(#tile)" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="5">
    <path d="M-20 120 C 110 60, 250 190, 540 90"/>
    <path d="M-20 200 C 140 130, 260 280, 540 170"/>
    <path d="M-20 470 C 150 390, 310 520, 540 410"/>
  </g>

  <!-- Flugspur -->
  <path d="M156 408 C 250 410, 150 330, 206 324" fill="none" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="1 24" stroke-opacity="0.9"/>

  <!-- Startplatz -->
  <circle cx="108" cy="408" r="34" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M96 394 V422 M120 394 V422 M96 408 H120" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- Quadrocopter (Draufsicht) -->
  <g filter="url(#shadow)">
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
      <path d="M320 200 L250 130 M320 200 L390 130 M320 200 L250 270 M320 200 L390 270"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="7">
      <circle cx="250" cy="130" r="46"/>
      <circle cx="390" cy="130" r="46"/>
      <circle cx="250" cy="270" r="46"/>
      <circle cx="390" cy="270" r="46"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="250" cy="130" r="10"/>
      <circle cx="390" cy="130" r="10"/>
      <circle cx="250" cy="270" r="10"/>
      <circle cx="390" cy="270" r="10"/>
      <rect x="284" y="154" width="72" height="92" rx="26"/>
    </g>
    <circle cx="320" cy="176" r="11" fill="#1A3F9E"/>
  </g>
</svg>
